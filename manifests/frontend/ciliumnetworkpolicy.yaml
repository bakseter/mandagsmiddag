apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mandagsmiddag-frontend
  namespace: mandagsmiddag
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mandagsmiddag-frontend

  ingress:
    # Allow ingress from Envoy Gateway
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: cloudflared
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP

  egress:
    # Allow DNS lookup for OpenTelemetry Collector
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchName: 'opentelemetry-collector-gateway.otel.svc.cluster.local'

    # Allow sending telemetry via OTLP to the OpenTelemetry Collector
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel
            app.kubernetes.io/instance: opentelemetry-collector
            app.kubernetes.io/name: gateway
      toPorts:
        - ports:
            - port: '4317'
              protocol: TCP
