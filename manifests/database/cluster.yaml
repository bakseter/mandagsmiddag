apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mandagsmiddag-database
  namespace: mandagsmiddag
  labels:
    bakseter.net/backup-primary: true
spec:
  instances: 3
  affinity:
    nodeSelector:
      node.longhorn.io/create-default-disk: 'true'
    enablePodAntiAffinity: true
    topologyKey: bakseter.net/physical-node
    podAntiAffinityType: required
  storage:
    size: 3Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
